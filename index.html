<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Features</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .card {
        background-color: white;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 15px;
      }

      .card h2 {
        margin-bottom: 10px;
      }

      .card p {
        color: #555;
      }
    </style>
  </head>

  <body>
    <h1>My Features</h1>

    <section class="features-grid">
      <div class="card">
        <div class="icon">💻</div>
        <h2>Web Development</h2>
        <p>Building modern and responsive websites.</p>
      </div>

      <div class="card">
        <div class="icon">👾</div>
        <h2>UI Design</h2>
        <p>Creating clean and user-friendly interfaces.</p>
      </div>

      <div class="card">
        <div class="icon">⚡</div>
        <h2>Performance</h2>
        <p>Optimizing applications for speed and efficiency.</p>
      </div>

      <div class="card">
        <div class="icon">🤓</div>
        <h2>Learning</h2>
        <p>Continuously improving my development skills.</p>
      </div>
    </section>
  </body>
</html>
